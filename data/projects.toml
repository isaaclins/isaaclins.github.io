# WORK on the home page: a `git log --graph`, newest first.
# Rendered by layouts/shortcodes/work.html.
#
# One [[commit]] per featured project:
#   color      the project's accent (node, refs, buttons, stage glow)
#   date/hash  left of the rail; hash = a real commit of the project
#   refs       outlined tags; refs_muted the grey ones
#   one        one sentence, what it is
#   why        two or three sentences, Markdown allowed
#   stack      [[commit.stack]] k/v rows under the text, Markdown allowed in v
#   links      [[commit.links]]; primary = filled button; copy = a button that
#              copies that value instead of a link (copied = toast text)
#   stage      the big picture: kind = "shot" | "video" | "chat" | "vault",
#              a shot may set img2/alt2 (same size): it crossfades in and out
#              one partial each in layouts/partials/home/stage-<kind>.html
#              (chat = the lines it replays; the vault flow is in its partial)
# Internal links start with "/", other isaaclins.com project sites
# (/freesnitch/, /spotiglass/, ...) are separate repos: use the full URL.

[[commit]]
id = "stewie"
name = "Stewie"
color = "#6f95ff"
date = "now"
hash = "a4d82da"
refs = ["HEAD -> main"]
