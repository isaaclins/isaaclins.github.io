{{/* The top bar every page shares: name left, sections and the theme toggle
     right. On the home page the section links are in-page anchors. */}}
{{- $home := site.Home.RelPermalink -}}
{{- $anchor := cond .IsHome "" $home -}}
<header class="top" id="top">
  <div class="wrap">
    <a class="brand" href="{{ $home }}"{{ if .IsHome }} aria-current="page"{{ end }}>isaaclins.com <span class="cursor" aria-hidden="true"></span></a>
    <nav class="nav" aria-label="Main">
      <a href="{{ $anchor }}#work">work</a>
      <a href="{{ if .IsHome }}#writing{{ else }}{{ "blog/" | relURL }}{{ end }}"{{ if eq .Section "blog" }} aria-current="page"{{ end }}>writing</a>
      <a class="hide-s" href="{{ "resume/" | relURL }}"{{ if eq .Section "resume" }} aria-current="page"{{ end }}>resume</a>
      <a class="hide-s" href="{{ $anchor }}#contact">contact</a>
      <button class="theme" type="button" aria-label="Switch light or dark">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </nav>
  </div>
</header>
