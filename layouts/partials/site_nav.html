{{/* Slim persistent nav: site name left, section links right.
     Static markup, no JS. Wraps to a second row on narrow screens. */}}
<nav class="site-nav" aria-label="Primary">
  <div class="site-nav-inner">
    <a class="site-nav-brand" href="{{ site.Home.RelPermalink }}"{{ if .IsHome }} aria-current="page"{{ end }}>isaaclins.com</a>
    <ul class="site-nav-links">
      <li><a href="{{ "/blog/" | relURL }}"{{ if eq .Section "blog" }} aria-current="page"{{ end }}>blog</a></li>
      <li><a href="{{ "/resume/" | relURL }}"{{ if eq .Section "resume" }} aria-current="page"{{ end }}>resume</a></li>
      <li><a href="{{ "/reading/" | relURL }}"{{ if eq .RelPermalink ("/reading/" | relURL) }} aria-current="page"{{ end }}>reading</a></li>
      <li><a href="{{ site.Home.RelPermalink }}#contact">contact</a></li>
    </ul>
  </div>
</nav>
