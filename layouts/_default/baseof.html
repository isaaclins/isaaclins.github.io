<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}">
    {{- partial "head.html" . -}}
    <body a="{{ $.Site.Params.theme_config.appearance | default "auto" }}">
        <a class="skip-link" href="#content">skip to content</a>
        {{ partial "site_nav.html" . }}
        <main class="page-content" id="content" aria-label="Content">
            <div class="w">
                {{ if and .IsSection (eq .Section "blog") }}
                <div id="search-popup" class="search-popup">
                    <div class="search-popup-content">
                        <span class="search-popup-close">&times;</span>
                        <input type="text" id="search-query" placeholder="Search posts..." />
                        <div id="search-results"></div>
                    </div>
                </div>
                {{ end }}
                {{- block "main" . }}{{- end }}
                {{ partial "footer.html" . }}
            </div>
        </main>
    </body>
</html>
