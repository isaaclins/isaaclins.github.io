{{/* Section heading: Isaac's slash motif, a label, a hairline to the right
     edge, and an optional grey aside after it. The label is also the anchor.
     Usage: {{< sec "work" "git log --graph" >}} */}}
{{- $label := .Get 0 -}}
<h2 class="head" id="{{ $label | anchorize }}">
  <span class="slashes" aria-hidden="true">//////////</span>{{ $label }}<span class="rule" aria-hidden="true"></span>
  {{- with .Get 1 }}<span class="aside">{{ . }}</span>{{ end }}
</h2>
